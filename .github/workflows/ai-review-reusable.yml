# AI Review Gate — 可复用 workflow（被目标仓以 workflow_call 引用）
# 目标仓只需一个薄 caller（见 ci/ai-review.yml 模板与 docs/ci-setup.md）
# 模型提供方通过变量/密钥配置：
#   secrets.AI_REVIEW_API_KEY     必填（Anthropic key 或 DeepSeek key）
#   vars.AI_REVIEW_BASE_URL       可选（DeepSeek: https://api.deepseek.com/anthropic；空 = Anthropic 直连）
#   vars.AI_REVIEW_MODEL          可选（如 deepseek-chat / deepseek-reasoner；空 = action 默认模型）
# 行为约定：diff <20 行或纯文档豁免跳过；评审失败不阻塞 PR（fail-open）。

name: ai-review-reusable

on:
  workflow_call:

permissions:
  contents: read
  security-events: write   # upload-sarif 需要
  id-token: write   # claude-code-action 需要 OIDC 换取 GitHub token
  pull-requests: write   # 评审结论评论回 PR

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout agent-reviewer（场景库 + scripts）
        uses: actions/checkout@v4
        with:
          repository: Atituiset/agent-reviewer
          ref: mvp
          path: .reviewer

      - name: 变更规模与豁免判定
        id: gate
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          STATS=$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d}')
          DOC_ONLY=$(git diff --name-only "$BASE"...HEAD | grep -vcE '\.(md|txt)$|^docs/' || true)
          if [ "${STATS:-0}" -lt 20 ]; then echo "skip=small" >> "$GITHUB_OUTPUT";
          elif [ "$DOC_ONLY" = "0" ]; then echo "skip=docs" >> "$GITHUB_OUTPUT";
          else echo "skip=" >> "$GITHUB_OUTPUT"; fi
          MODE=$(cat .ai-review-mode 2>/dev/null || echo "2")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "评审模式: $MODE (1=纯场景库 2=+codegraph 3=+navmap)"

      - name: 打包评审输入（diff）
        if: steps.gate.outputs.skip == ''
        run: |
          git diff "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/pr.diff
          cd .reviewer && bash scripts/setup-env.sh || true

      - name: codegraph 调用图索引（供跨函数判空链回溯）
        if: steps.gate.outputs.skip == '' && steps.gate.outputs.mode != '1'
        run: |
          npm i -g @colbymchenry/codegraph --silent 2>&1 | tail -1
          codegraph init 2>&1 | tail -1 || true
          codegraph sync 2>&1 | tail -3

      - name: navmap 语义导航图产物（模式 3：读 navmap-outputs 分支）
        if: steps.gate.outputs.skip == '' && steps.gate.outputs.mode == '3'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: navmap-outputs
          path: .navmap-out

      - name: 组装评审 prompt（按模式）
        if: steps.gate.outputs.skip == ''
        id: promptbuild
        run: |
          {
            echo "你是 task-reviewer。读取 /tmp/pr.diff 与 .reviewer/rules/registry.json："
            echo "1. 用 .reviewer/scripts/_lib.py scenarios-for 对 diff 触及的每个文件做场景路由"
            echo "2. 对每个命中场景，读 .reviewer/rules/scenarios/<key>/SKILL.md 清单逐项评审（需要深入项时读 references/detailed-checks.md）"
            echo "3. 纪律：只报有 file:line 证据的具体缺陷；置信度 ≥80 才报；风格问题不报"
            if [ "${{ steps.gate.outputs.mode }}" != "1" ]; then
              echo "3.5 跨函数判空链回溯（cwe-476 类候选必做）：上报「解引用未判空」前，用 codegraph CLI（codegraph callers <fn> / callees <fn>）沿调用链回溯 ≤10 跳：上游找到判空（同一指针）→ 不报（FP 证伪，可在 reasoning 记录证伪链）；链在函数指针/虚函数处中断 → 保留但 reasoning 必须标注「链中断于 X，静态不可判定」；未做链回溯的跨函数判空 finding 不报"
            fi
            if [ "${{ steps.gate.outputs.mode }}" == "3" ]; then
              echo "3.6 navmap 语义导航图可用：.navmap-out/.navmap/out/ 下有本仓消息分发表/状态机表（JSON+md）。判空链在函数指针/分发表处中断时，读对应表把「不确定目标」展开为 handler 集合做保守近似：集合内全部 handler 有判空才可证伪（REFUTED），任一缺失只能 PLAUSIBLE 并标注依据的表"
            fi
            echo "4. 将结果写为 .review/review-artifact.json（用 Write 工具；先 mkdir -p .review），schema："
            echo "   {diff_hash(对 /tmp/pr.diff 的 sha256), verdict(CLEAN|ISSUES_FOUND),"
            echo "    reviewed_at(ISO8601), reviewer:\"ci-task-reviewer\", spec_ref:\"none\","
            echo "    findings:[{file,line,severity(critical|important|minor),category,"
            echo "               scenario(必须是 registry 中存在的场景键),summary,detail,"
            echo "               confidence,resolved:false,"
            echo "               flow:[{file,line,message}](证据链有序步骤：从上游源头（分配/构造/注册点）到缺陷点完整覆盖，必填),"
            echo "               reasoning(一句话判断理由)}]}"
          } > /tmp/review-prompt.txt
          echo "prompt<<PROMPT_EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/review-prompt.txt >> "$GITHUB_OUTPUT"
          echo "PROMPT_EOF" >> "$GITHUB_OUTPUT"

      - name: 场景评审（按 SKILL 清单产出工件）
        if: steps.gate.outputs.skip == ''
        id: review
        continue-on-error: true   # fail-open：评审失败不阻塞 PR
        uses: anthropics/claude-code-action@v1
        env:
          # 空值 = Anthropic 直连；配置后走任意 Anthropic 兼容端点（DeepSeek/Z.ai/Kimi/...）
          ANTHROPIC_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_REVIEW_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # 绕过 Claude GitHub App 安装要求
          anthropic_api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          claude_args: --allowedTools "Read,Write,Grep,Glob,Bash"
          prompt: ${{ steps.promptbuild.outputs.prompt }}

      - name: 重新检出 agent-reviewer（防 workspace 被评审步骤重置）
        if: steps.gate.outputs.skip == '' && steps.review.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: Atituiset/agent-reviewer
          ref: mvp
          path: .reviewer

      - name: 工件 → SARIF
        if: steps.gate.outputs.skip == '' && steps.review.outcome == 'success'
        run: |
          ls -la "$GITHUB_WORKSPACE/.review/review-artifact.json" || { echo "工件缺失（评审未产出）——fail-open 跳过"; exit 0; }
          export SARIF_VIEWER_URI="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd .reviewer && bash scripts/artifact-to-sarif.sh "$GITHUB_WORKSPACE/.review/review-artifact.json" /tmp/review.sarif
          cp /tmp/review.sarif "$GITHUB_WORKSPACE/.review.sarif" || cp /tmp/review.sarif ./review.sarif

      - name: 评审结论评论回 PR（人读层：判断理由 + 证据链）
        if: steps.gate.outputs.skip == '' && steps.review.outcome == 'success' && vars.AI_REVIEW_PR_COMMENT == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$GITHUB_WORKSPACE/.review/review-artifact.json" ] || exit 0
          python3 - "$GITHUB_WORKSPACE/.review/review-artifact.json" > /tmp/comment.md <<'PYEOF'
          import json, sys
          art = json.load(open(sys.argv[1]))
          findings = art.get("findings", [])
          print(f"## 🤖 AI Review（{art.get('reviewer','?')}）—— verdict: **{art.get('verdict')}**")
          print(f"扫描场景：{', '.join(art.get('scenarios_scanned', []))}\n")
          if not findings:
              print("未发现达到上报阈值（置信度 ≥80 + file:line 证据）的缺陷。")
          for i, f in enumerate(findings, 1):
              print(f"### {i}. [{f.get('severity')}] {f.get('scenario')} —— {f.get('summary')}")
              print(f"📍 `{f.get('file')}:{f.get('line')}` · 置信度 {f.get('confidence')}%")
              if f.get("reasoning"):
                  print(f"\n**判断理由**：{f['reasoning']}")
              if f.get("flow"):
                  print("\n**证据链**：")
                  for s in f["flow"]:
                      print(f"- `{s.get('file')}:{s.get('line')}` {s.get('message')}")
              print()
          print("---")
          print("*codeFlows / 完整评审轨迹见 Checks → agent-reviewer 与 Actions Artifacts*")
          PYEOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md || echo "评论失败（fail-open 不阻塞）"

      - name: 归档评审轨迹与工件
        if: steps.gate.outputs.skip == '' && steps.review.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review-transcript
          path: |
            /home/runner/work/_temp/claude-execution-output.json
            /tmp/review.sarif
          if-no-files-found: ignore

      - uses: github/codeql-action/upload-sarif@v3
        if: steps.gate.outputs.skip == '' && steps.review.outcome == 'success'
        with:
          sarif_file: /tmp/review.sarif
          category: agent-reviewer

      - name: 豁免/失败说明（fail-open 留痕）
        if: always()
        run: |
          if [ -n "${{ steps.gate.outputs.skip }}" ]; then
            echo "ai-review skipped: ${{ steps.gate.outputs.skip }}（豁免）"
          elif [ "${{ steps.review.outcome }}" != "success" ]; then
            echo "ai-review failed but not blocking（fail-open）"
          fi
